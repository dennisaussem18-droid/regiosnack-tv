<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RegioSnack TV – Langerwehe</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:white;font-family:Arial,sans-serif}.screen{height:100vh;height:100dvh;display:grid;grid-template-rows:11% minmax(0,1fr) 10%;grid-template-columns:55% minmax(0,1fr);gap:.45vh;padding:.5vh .6vw}.brand{grid-column:1/-1;text-align:center;min-height:0;overflow:hidden;background:radial-gradient(ellipse,#34200a,#050505 75%);border-bottom:2px solid #ffd500}.logo{font-size:clamp(20px,4.2vh,70px);font-weight:1000;font-style:italic;line-height:1.03;letter-spacing:-.055em;text-shadow:0 2px 5px #666}.logo b{color:#f11922}.logo em{background:#bd0712;border:2px solid white;border-radius:7px;padding:0 .18em;font-style:normal;color:white}.tag{font-size:clamp(10px,1.7vh,24px);font-weight:800}.location{display:inline-block;background:#b50915;font-size:clamp(11px,1.85vh,27px);font-weight:900;padding:0 .8em}.panel{border:3px solid #f9cf00;border-radius:1vh;min-height:0;overflow:hidden;box-shadow:0 0 10px #a77d00;background:#080b10}.departures{display:flex;flex-direction:column}.heading{background:linear-gradient(#155f97,#032445);padding:.28vh 1vw;font-weight:900;font-size:clamp(15px,2.7vh,38px);border-bottom:2px solid #f9cf00}.framebox{position:relative;flex:1;min-height:0;overflow:hidden;background:#0c1118}.trainframe{position:absolute;top:0;left:0;border:0;width:147.06%;height:147.06%;transform:scale(.68);transform-origin:top left;background:#0c1118}.rightside{display:flex;flex-direction:column;gap:.45vh;min-height:0}.newsbox{height:8%;min-height:38px;display:flex;flex-direction:row;align-items:stretch;background:#090c10}.newshead{font-size:clamp(12px,1.8vh,22px);font-weight:900;padding:0 .6vw;background:#ffd500;color:#080808;display:flex;align-items:center;white-space:nowrap}.ticker{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;align-items:center}.tickertext{display:inline-block;white-space:nowrap;padding-left:100%;font-size:clamp(14px,2.1vh,25px);font-weight:700;animation:newsroll 65s linear infinite;will-change:transform}.tickertext span{padding-right:3em;color:#ffd500}@keyframes newsroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}.rightside .videoarea{flex:1}.videoarea{position:relative;display:flex;align-items:center;justify-content:center;background:black}.videoarea video{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:contain}.videoarea:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,#2c1a05,#050505 78%)}.hint{z-index:2;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#111c;color:#fff;border:1px solid #ffd500;padding:7px 14px;border-radius:8px;font-size:14px;display:none}.clock{grid-column:1/-1;display:flex;align-items:center;justify-content:space-around;gap:1vw;padding:0 1vw;font-weight:900}.date{font-size:clamp(13px,3vh,40px)}.now{font-size:clamp(26px,6vh,80px);font-variant-numeric:tabular-nums}.separator{height:60%;width:3px;background:#ffd500}@media (orientation:portrait){.screen{grid-template-rows:9% 45% minmax(0,1fr) 9%;grid-template-columns:1fr}.newsbox{height:10%}.logo{font-size:3.7vh}.now{font-size:4vh}.date{font-size:2vh}}</style></head><body><main class="screen"><header class="brand"><div class="logo">Regio<b>Snack</b> <em>TV</em></div><div class="tag">ESSEN • TRINKEN • GENIESSEN</div><div class="location">Am Bahnhof Langerwehe</div></header><section class="panel departures"><div class="heading">🚆 Live-Abfahrten · Langerwehe</div><div class="framebox"><iframe class="trainframe" title="Live-Abfahrten Bahnhof Langerwehe" loading="eager" referrerpolicy="no-referrer" src="https://dbf.finalrewind.org/Langerwehe"></iframe></div></section><div class="rightside"><section class="panel newsbox"><div class="newshead">📰 NEWS</div><div class="ticker"><div class="tickertext" id="newsText">Regionale Nachrichten werden geladen … <span>◆</span></div></div></section><section class="panel videoarea"><video id="ad" autoplay muted loop playsinline preload="auto" controlslist="nodownload" disablepictureinpicture><source src="werbung.mp4" type="video/mp4"></video><button class="hint" id="play" type="button">▶ Video starten</button></section></div><footer class="panel clock"><div class="date" id="date"></div><div class="separator"></div><div class="now" id="time"></div></footer></main><script>const dateEl=document.getElementById('date'),timeEl=document.getElementById('time'),v=document.getElementById('ad'),btn=document.getElementById('play');function tick(){const d=new Date();dateEl.textContent=new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'2-digit',month:'long',year:'numeric'}).format(d);timeEl.textContent=new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d)}tick();setInterval(tick,1000);function start(){v.muted=true;const p=v.play();if(p&&p.catch)p.catch(()=>btn.style.display='block')}v.addEventListener('canplay',start,{once:true});v.addEventListener('playing',()=>btn.style.display='none');v.addEventListener('error',()=>btn.style.display='block');btn.addEventListener('click',start);document.addEventListener('click',()=>{if(v.paused)start()});start();const newsEl=document.getElementById('newsText');async function loadNews(){const query='(Aachen OR Düren OR Langerwehe OR Jülich OR Eschweiler)';const feed='https://news.google.com/rss/search?q='+encodeURIComponent(query)+'&hl=de&gl=DE&ceid=DE:de';const sources=['https://api.allorigins.win/raw?url='+encodeURIComponent(feed),'https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed)];for(const url of sources){try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),12000);let response;try{response=await fetch(url,{signal:controller.signal,cache:'no-store'})}finally{clearTimeout(timeout)}if(!response.ok)throw Error('HTTP '+response.status);const raw=await response.text();let titles=[];if(raw.trim().startsWith('{')){const data=JSON.parse(raw);titles=(data.items||[]).map(x=>x.title)}else{const xml=new DOMParser().parseFromString(raw,'application/xml');titles=Array.from(xml.querySelectorAll('item > title')).map(x=>x.textContent)}titles=titles.map(x=>x.replace(/\\s+-\\s+[^-]+$/,'').trim()).filter(Boolean).slice(0,10);if(!titles.length)throw Error('Keine Meldungen');newsEl.textContent=titles.join('     ◆     ')+'     ◆     ';newsEl.style.animation='none';void newsEl.offsetWidth;newsEl.style.animation='';return}catch(e){console.warn('Newsfeed nicht verfügbar',e)}}if(!newsEl.dataset.loaded)newsEl.textContent='Regionale Nachrichten momentan nicht verfügbar · Nächster Versuch in 30 Minuten     ◆     ';else newsEl.textContent+='     ◆     ';}loadNews();setInterval(loadNews,30*60*1000);</script></body></html>
